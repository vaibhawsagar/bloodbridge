<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BloodBridge</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8f9fa; }
        .auth-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .role-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; }
        .role-tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #666; font-weight: 500; border-bottom: 2px solid transparent; }
        .role-tab.active { color: #C62828; border-bottom-color: #C62828; }
        .password-toggle { position: absolute; right: 10px; top: 38px; cursor: pointer; color: #666; }
        .form-group { position: relative; margin-bottom: 1rem; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="text-center" style="margin-bottom: 2rem; text-align: center;">
            <i class="fa-solid fa-droplet fa-3x" style="color: #C62828;"></i>
            <h2 style="margin-top: 1rem; color: #333;">BloodBridge Login</h2>
        </div>

        <div id="successBanner" class="alert alert-success" style="display: none; margin-bottom: 1rem; padding: 1rem; background-color: #d4edda; color: #155724; border-radius: 4px; border: 1px solid #c3e6cb;">
            Registration successful! Please login.
        </div>

        <div id="loginError" class="login-error alert alert-danger" style="display: none; margin-bottom: 1rem; padding: 1rem; background-color: #f8d7da; color: #721c24; border-radius: 4px; border: 1px solid #f5c6cb;"></div>

        <div class="role-tabs">
            <div class="role-tab active" data-role="donor">Donor</div>
            <div class="role-tab" data-role="recipient">Recipient</div>
            <div class="role-tab" data-role="admin">Admin</div>
        </div>

        <form id="loginForm">
            <input type="hidden" id="role" name="role" value="donor">
            
            <div class="form-group">
                <label for="email" class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="Enter your email" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div class="form-group">
                <label for="password" class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter your password" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem; background: #C62828; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Login</button>
        </form>

        <div class="text-center" style="margin-top: 1.5rem; text-align: center;">
            <p style="margin-bottom: 0.5rem; color: #555;">Don't have an account? <a href="role-selection.html" style="color: #C62828; text-decoration: none; font-weight: bold;">Register here</a></p>
            <p style="margin-top: 0.5rem;"><a href="../../index.html" style="color: #666; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
        </div>
    </div>

    <!-- Foundation JS -->
    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    
    <!-- Page JS -->
    <script>
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById('role').value = e.target.dataset.role;
            });
        });

        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === '1') {
            document.getElementById('successBanner').style.display = 'block';
        }

        // Auto-select role tab based on URL
        const urlRole = urlParams.get('role');
        if (urlRole) {
            const targetTab = document.querySelector(`.role-tab[data-role="${urlRole}"]`);
            if (targetTab) {
                targetTab.click();
            }
        }
    </script>
    <script src="../../js/auth/login.js"></script>
</body>
</html>
