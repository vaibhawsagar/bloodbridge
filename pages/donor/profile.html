<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BloodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <a href="./dashboard.html" class="sidebar-brand">
            <div class="sidebar-logo"><i class="fa-solid fa-droplet"></i></div>
            <div class="sidebar-brand-text"><h2>BloodBridge</h2><small>Blood Bank System</small></div>
        </a>
        <div class="sidebar-nav">
            <div class="nav-section-label">Donor Menu</div>
            <div class="sidebar-item"><a href="./dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span class="link-label">Dashboard</span></a></div>
            <div class="sidebar-item"><a href="./profile.html" class="sidebar-link active"><i class="fa-solid fa-user"></i><span class="link-label">My Profile</span></a></div>
            <div class="sidebar-item"><a href="./eligibility.html" class="sidebar-link"><i class="fa-solid fa-heart-pulse"></i><span class="link-label">Check Eligibility</span></a></div>
            <div class="sidebar-item"><a href="./camps.html" class="sidebar-link"><i class="fa-solid fa-tent-medical"></i><span class="link-label">Donation Camps</span></a></div>
            <div class="sidebar-item"><a href="./donation-history.html" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i><span class="link-label">Donation History</span></a></div>
            <div class="sidebar-item"><a href="./certificate.html" class="sidebar-link"><i class="fa-solid fa-certificate"></i><span class="link-label">My Certificate</span></a></div>
            <div class="sidebar-item"><a href="./notifications.html" class="sidebar-link"><i class="fa-solid fa-bell"></i><span class="link-label">Notifications</span><span class="notif-badge" id="notif-count" style="display:none">0</span></a></div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="userInitial">D</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="userName">Donor</div>
                    <div class="sidebar-user-role">Donor</div>
                </div>
            </div>
            <a href="../../pages/auth/login.html" class="sidebar-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="navbar-breadcrumb">Donor Portal / <span id="pageTitle">My Profile</span></div>
            </div>
            <div class="navbar-right">
                <button class="navbar-notif-btn" onclick="window.location.href='./notifications.html'">
                    <i class="fa-solid fa-bell"></i>
                    <span class="navbar-notif-dot" id="notifDot" style="display:none"></span>
                </button>
            </div>
        </header>

        <div class="content-container">
            <div id="toast" class="alert alert-success" style="display: none; position: fixed; top: 20px; right: 20px; z-index: 1000;">Profile updated successfully!</div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Profile Information</h2>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="donorName">Full Name</label>
                                <input type="text" id="donorName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="donorEmail">Email (Read Only)</label>
                                <input type="email" id="donorEmail" class="form-control" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="donorPhone">Phone Number</label>
                                <input type="tel" id="donorPhone" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="donorBloodGroup">Blood Group (Read Only)</label>
                                <input type="text" id="donorBloodGroup" class="form-control" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="donorAddress">Address</label>
                            <textarea id="donorAddress" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="donorWeight">Weight (kg)</label>
                                <input type="number" id="donorWeight" class="form-control" min="0" step="0.1">
                            </div>
                            <div class="form-group">
                                <label for="donorHaemoglobin">Haemoglobin Level (g/dL)</label>
                                <input type="number" id="donorHaemoglobin" class="form-control" min="0" step="0.1">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="donorAge">Age</label>
                                <input type="number" id="donorAge" class="form-control" min="1" step="1">
                            </div>
                            <div class="form-group">
                                <label for="donorLastDonation">Last Donation Date</label>
                                <input type="date" id="donorLastDonation" class="form-control">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="donorHealthHistory">Health History</label>
                            <textarea id="donorHealthHistory" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="form-group" style="text-align: right;">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    <script src="../../js/donor/profile.js"></script>
</body>
</html>
