<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - BloodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .notif-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: flex-start; gap: 15px; transition: background 0.3s; }
        .notif-item:hover { background: #f9f9f9; }
        .notif-item.unread { background: #f0f7ff; }
        .notif-item.unread:hover { background: #e6f2ff; }
        .notif-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; flex-shrink: 0; }
        .notif-content { flex-grow: 1; }
        .notif-title { font-weight: bold; margin-bottom: 5px; }
        .notif-text { color: #555; margin-bottom: 5px; }
        .notif-meta { font-size: 0.8rem; color: #888; }
        .notif-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-color); flex-shrink: 0; margin-top: 15px; display: none; }
        .notif-item.unread .notif-dot { display: block; }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <a href="./dashboard.html" class="sidebar-brand">
            <div class="sidebar-logo"><i class="fa-solid fa-droplet"></i></div>
            <div class="sidebar-brand-text"><h2>BloodBridge</h2><small>Blood Bank System</small></div>
        </a>
        <div class="sidebar-nav">
            <div class="nav-section-label">Donor Menu</div>
            <div class="sidebar-item"><a href="./dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span class="link-label">Dashboard</span></a></div>
            <div class="sidebar-item"><a href="./profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i><span class="link-label">My Profile</span></a></div>
            <div class="sidebar-item"><a href="./eligibility.html" class="sidebar-link"><i class="fa-solid fa-heart-pulse"></i><span class="link-label">Check Eligibility</span></a></div>
            <div class="sidebar-item"><a href="./camps.html" class="sidebar-link"><i class="fa-solid fa-tent-medical"></i><span class="link-label">Donation Camps</span></a></div>
            <div class="sidebar-item"><a href="./donation-history.html" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i><span class="link-label">Donation History</span></a></div>
            <div class="sidebar-item"><a href="./certificate.html" class="sidebar-link"><i class="fa-solid fa-certificate"></i><span class="link-label">My Certificate</span></a></div>
            <div class="sidebar-item"><a href="./notifications.html" class="sidebar-link active"><i class="fa-solid fa-bell"></i><span class="link-label">Notifications</span><span class="notif-badge" id="notif-count" style="display:none">0</span></a></div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="userInitial">D</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="userName">Donor</div>
                    <div class="sidebar-user-role">Donor</div>
                </div>
            </div>
            <a href="../../pages/auth/login.html" class="sidebar-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="navbar-breadcrumb">Donor Portal / <span id="pageTitle">Notifications</span></div>
            </div>
            <div class="navbar-right">
                <button class="navbar-notif-btn" onclick="window.location.href='./notifications.html'">
                    <i class="fa-solid fa-bell"></i>
                    <span class="navbar-notif-dot" id="notifDot" style="display:none"></span>
                </button>
            </div>
        </header>

        <div class="content-container">
            <div class="card">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="card-title">My Notifications</h2>
                    <div>
                        <select id="notifFilter" class="form-control d-inline-block" style="width: auto; margin-right: 10px;">
                            <option value="All">All</option>
                            <option value="Unread">Unread</option>
                            <option value="Read">Read</option>
                        </select>
                        <button id="markAllBtn" class="btn btn-sm btn-outline"><i class="fa-solid fa-check-double"></i> Mark All as Read</button>
                    </div>
                </div>
                <div class="card-body p-0" id="notifList">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    <script src="../../js/donor/notifications.js"></script>
</body>
</html>
