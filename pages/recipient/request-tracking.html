<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Requests - BloodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .status-tracker {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 20px 0 30px;
        }
        .status-tracker::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: #e2e8f0;
            z-index: 1;
        }
        .status-step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 80px;
            font-size: 0.75rem;
            color: #64748b;
        }
        .status-step .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            color: #94a3b8;
            font-weight: bold;
        }
        .status-step.completed .icon {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }
        .status-step.active .icon {
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }
        .status-step.completed, .status-step.active {
            color: var(--text-dark);
            font-weight: 500;
        }
        
        .status-tracker.has-rejected .status-step.rejected .icon {
            border-color: var(--danger-color);
            background: var(--danger-color);
            color: white;
        }
        .status-tracker.has-cancelled .status-step.cancelled .icon {
            border-color: var(--warning-color);
            background: var(--warning-color);
            color: white;
        }

        .request-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            background: white;
        }
        .request-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            background: #f8fafc;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }
        .request-header:hover {
            background: #f1f5f9;
        }
        .request-body {
            padding: 1.5rem;
            display: none;
        }
        .request-body.expanded {
            display: block;
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <a href="./dashboard.html" class="sidebar-brand">
                <div class="sidebar-logo"><i class="fa-solid fa-droplet"></i></div>
                <div class="sidebar-brand-text"><h2>BloodBridge</h2><small>Blood Bank System</small></div>
            </a>
            <div class="sidebar-nav">
                <div class="nav-section-label">Recipient Menu</div>
                <div class="sidebar-item"><a href="./dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span class="link-label">Dashboard</span></a></div>
                <div class="sidebar-item"><a href="./profile.html" class="sidebar-link"><i class="fa-solid fa-building-columns"></i><span class="link-label">My Profile</span></a></div>
                <div class="sidebar-item"><a href="./blood-availability.html" class="sidebar-link"><i class="fa-solid fa-magnifying-glass"></i><span class="link-label">Blood Availability</span></a></div>
                <div class="sidebar-item"><a href="./request-blood.html" class="sidebar-link"><i class="fa-solid fa-hand-holding-droplet"></i><span class="link-label">Request Blood</span></a></div>
                <div class="sidebar-item active"><a href="./request-tracking.html" class="sidebar-link"><i class="fa-solid fa-route"></i><span class="link-label">Track Requests</span></a></div>
                <div class="sidebar-item"><a href="./notifications.html" class="sidebar-link"><i class="fa-solid fa-bell"></i><span class="link-label">Notifications</span><span class="notif-badge" id="notif-count" style="display:none">0</span></a></div>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-user"><div class="sidebar-user-avatar" id="userInitial">R</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">Recipient</div><div class="sidebar-user-role">Hospital</div></div></div>
                <a href="../../pages/auth/login.html" class="sidebar-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-title">Track Requests</div>
                <div class="topbar-actions">
                    <a href="./notifications.html" class="topbar-action"><i class="fa-regular fa-bell"></i><span class="notif-dot" id="notifDot" style="display:none"></span></a>
                </div>
            </header>

            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="m-0">Your Blood Requests</h3>
                    <select class="form-select w-auto" id="statusFilter">
                        <option value="All">All Statuses</option>
                        <option value="Active">Active Requests</option>
                        <option value="PendingApproval">Pending Approval</option>
                        <option value="Approved">Approved</option>
                        <option value="Fulfilled">Fulfilled</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div id="requestsContainer">
                    <!-- Requests injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    <script src="../../js/recipient/request-tracking.js"></script>
</body>
</html>
