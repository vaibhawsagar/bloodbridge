<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - BloodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <a href="./dashboard.html" class="sidebar-brand">
                <div class="sidebar-logo"><i class="fa-solid fa-droplet"></i></div>
                <div class="sidebar-brand-text"><h2>BloodBridge</h2><small>Blood Bank System</small></div>
            </a>
            <div class="sidebar-nav">
                <div class="nav-section-label">Recipient Menu</div>
                <div class="sidebar-item"><a href="./dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span class="link-label">Dashboard</span></a></div>
                <div class="sidebar-item"><a href="./profile.html" class="sidebar-link"><i class="fa-solid fa-building-columns"></i><span class="link-label">My Profile</span></a></div>
                <div class="sidebar-item"><a href="./blood-availability.html" class="sidebar-link"><i class="fa-solid fa-magnifying-glass"></i><span class="link-label">Blood Availability</span></a></div>
                <div class="sidebar-item"><a href="./request-blood.html" class="sidebar-link"><i class="fa-solid fa-hand-holding-droplet"></i><span class="link-label">Request Blood</span></a></div>
                <div class="sidebar-item"><a href="./request-tracking.html" class="sidebar-link"><i class="fa-solid fa-route"></i><span class="link-label">Track Requests</span></a></div>
                <div class="sidebar-item active"><a href="./notifications.html" class="sidebar-link"><i class="fa-solid fa-bell"></i><span class="link-label">Notifications</span><span class="notif-badge" id="notif-count" style="display:none">0</span></a></div>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-user"><div class="sidebar-user-avatar" id="userInitial">R</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">Recipient</div><div class="sidebar-user-role">Hospital</div></div></div>
                <a href="../../pages/auth/login.html" class="sidebar-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-title">Notifications</div>
                <div class="topbar-actions">
                    <a href="./notifications.html" class="topbar-action active"><i class="fa-regular fa-bell"></i><span class="notif-dot" id="notifDot" style="display:none"></span></a>
                </div>
            </header>

            <div class="content-area">
                <div class="card max-w-4xl mx-auto">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline active" id="filterAll">All</button>
                            <button class="btn btn-sm btn-outline" id="filterUnread">Unread</button>
                        </div>
                        <button class="btn btn-sm btn-text" id="markAllReadBtn">Mark All as Read</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="notification-list" id="notificationContainer">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    <script src="../../js/recipient/notifications.js"></script>
</body>
</html>
