<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Availability - BloodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <a href="./dashboard.html" class="sidebar-brand">
                <div class="sidebar-logo"><i class="fa-solid fa-droplet"></i></div>
                <div class="sidebar-brand-text"><h2>BloodBridge</h2><small>Blood Bank System</small></div>
            </a>
            <div class="sidebar-nav">
                <div class="nav-section-label">Recipient Menu</div>
                <div class="sidebar-item"><a href="./dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span class="link-label">Dashboard</span></a></div>
                <div class="sidebar-item"><a href="./profile.html" class="sidebar-link"><i class="fa-solid fa-building-columns"></i><span class="link-label">My Profile</span></a></div>
                <div class="sidebar-item active"><a href="./blood-availability.html" class="sidebar-link"><i class="fa-solid fa-magnifying-glass"></i><span class="link-label">Blood Availability</span></a></div>
                <div class="sidebar-item"><a href="./request-blood.html" class="sidebar-link"><i class="fa-solid fa-hand-holding-droplet"></i><span class="link-label">Request Blood</span></a></div>
                <div class="sidebar-item"><a href="./request-tracking.html" class="sidebar-link"><i class="fa-solid fa-route"></i><span class="link-label">Track Requests</span></a></div>
                <div class="sidebar-item"><a href="./notifications.html" class="sidebar-link"><i class="fa-solid fa-bell"></i><span class="link-label">Notifications</span><span class="notif-badge" id="notif-count" style="display:none">0</span></a></div>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-user"><div class="sidebar-user-avatar" id="userInitial">R</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">Recipient</div><div class="sidebar-user-role">Hospital</div></div></div>
                <a href="../../pages/auth/login.html" class="sidebar-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-title">Check Blood Availability</div>
                <div class="topbar-actions">
                    <a href="./notifications.html" class="topbar-action"><i class="fa-regular fa-bell"></i><span class="notif-dot" id="notifDot" style="display:none"></span></a>
                </div>
            </header>

            <div class="content-area">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-end gap-3 flex-wrap">
                            <div class="form-group flex-grow-1" style="max-width: 300px;">
                                <label class="form-label">Blood Group</label>
                                <select class="form-select" id="bloodGroupFilter">
                                    <option value="All">All Blood Groups</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                            <div class="form-group flex-grow-1" style="max-width: 300px;">
                                <label class="form-label">Search Location/Branch (Optional)</label>
                                <input type="text" class="form-control" id="searchLocation" placeholder="Search...">
                            </div>
                            <button class="btn btn-outline" id="refreshBtn"><i class="fa-solid fa-rotate-right me-2"></i>Refresh</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table" id="availabilityTable">
                                <thead>
                                    <tr>
                                        <th>Blood Group</th>
                                        <th>Available Units</th>
                                        <th>Stock Status</th>
                                        <th class="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/data/mock-data.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/status.js"></script>
    <script src="../../js/utils/validation.js"></script>
    <script src="../../js/services/notification-service.js"></script>
    <script src="../../js/services/inventory-service.js"></script>
    <script src="../../js/services/request-service.js"></script>
    <script src="../../js/services/activity-log-service.js"></script>
    <script src="../../js/recipient/availability.js"></script>
</body>
</html>
